[program:cf-gtm]
command=/www/wwwroot/cf-gtm/venv/bin/python /www/wwwroot/cf-gtm/app.py
directory=/www/wwwroot/cf-gtm
user=root
environment=PYTHONIOENCODING="utf-8"
autostart=true
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/www/server/panel/plugin/supervisor/log/cf-gtm.out.log
stderr_logfile=/www/server/panel/plugin/supervisor/log/cf-gtm.err.log
stdout_logfile_maxbytes=2MB
stderr_logfile_maxbytes=2MB
numprocs=1
process_name=%(program_name)s_%(process_num)02d
priority=999
